services:
  postgres:
    image: postgres:16-alpine
    container_name: cppforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cppforge
      POSTGRES_USER: cppforge
      POSTGRES_PASSWORD: secret_password_123
    ports:
      - "5432:5432"
    volumes:
      - cppforge_pgdata:/var/lib/postgresql/data
      - ./src/data/migrations/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/data/migrations/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

volumes:
  cppforge_pgdata:
