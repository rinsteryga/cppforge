name: Cross-Platform Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Setup Dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y qtbase5-dev qt5-qmake cmake build-essential qtdeclarative5-dev qttools5-dev ninja-build postgresql

    - name: Setup Dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install qt@5 ninja
        echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@5)" >> $GITHUB_ENV
        echo "PATH=$(brew --prefix qt@5)/bin:$PATH" >> $GITHUB_ENV

    - name: Setup MSYS2 (Windows)
      if: matrix.os == 'windows-latest'
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        cache: false
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-qt5-base
          mingw-w64-ucrt-x86_64-qt5-tools   
          mingw-w64-ucrt-x86_64-qt5-declarative
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-nsis
          mingw-w64-ucrt-x86_64-postgresql

    - name: Configure CMake (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        cmake -B build -G Ninja \
        -DCMAKE_BUILD_TYPE=Release

    - name: Configure CMake (Windows)
      if: matrix.os == 'windows-latest'
      shell: msys2 {0}
      run: |          
        cmake -B build -G Ninja \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_PREFIX_PATH=/ucrt64 \
        -DCMAKE_CXX_COMPILER="$(cygpath -m /ucrt64/bin/g++.exe)" \
        -DCMAKE_C_COMPILER="$(cygpath -m /ucrt64/bin/gcc.exe)"

    - name: Build
      if: matrix.os != 'windows-latest'
      run: cmake --build build

    - name: Build (Windows)
      if: matrix.os == 'windows-latest'
      shell: msys2 {0}
      run: cmake --build build

    - name: Package
      if: matrix.os != 'windows-latest'
      run: cmake --build build --target package

    - name: Package (Windows)
      if: matrix.os == 'windows-latest'
      shell: msys2 {0}
      run: cmake --build build --target package

    - name: Upload Release Artifacts
      uses: softprops/action-gh-release@v2
      with:
        files: |
          build/cppforge-*.exe
          build/cppforge-*.dmg
          build/cppforge-*.deb
          build/cppforge-*.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
